<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="1060" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b6b7c"/>
    </marker>
    <style>
      .box  { stroke-width:2; rx:8; }
      .t    { font-size:13px; font-weight:600; fill:#1b2733; }
      .s    { font-size:10.5px; fill:#4a5b6b; }
      .lbl  { font-size:10px; fill:#5b6b7c; font-style:italic; }
      .ln   { stroke:#5b6b7c; stroke-width:2; fill:none; }
      .dn   { stroke:#c0392b; stroke-width:2; fill:none; stroke-dasharray:5 4; }
      .zn   { font-size:11px; font-weight:700; fill:#7a8899; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="1060" height="840" fill="#fbfcfd"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1b2733">Northwind Craft Supplies — Target Network Architecture</text>
  <text x="30" y="54" class="s">Segmented design with DMZ-equivalent cloud tier, VLAN isolation and out-of-band management</text>

  <!-- zone bands -->
  <rect x="20" y="72" width="1020" height="150" fill="#f2f6fa" stroke="#dbe4ed" rx="10"/>
  <text x="34" y="92" class="zn">UNTRUSTED ZONE — INTERNET</text>

  <rect x="20" y="238" width="1020" height="118" fill="#fff8ec" stroke="#f0dcbb" rx="10"/>
  <text x="34" y="258" class="zn">PERIMETER — EDGE CONTROL</text>

  <rect x="20" y="372" width="1020" height="300" fill="#f1f8f3" stroke="#cfe6d7" rx="10"/>
  <text x="34" y="392" class="zn">TRUSTED INTERNAL ZONE — SEGMENTED VLANs</text>

  <rect x="20" y="688" width="1020" height="118" fill="#f2f4fb" stroke="#d9dff2" rx="10"/>
  <text x="34" y="708" class="zn">RECOVERY ZONE — OFFSITE</text>

  <!-- internet row -->
  <rect x="60" y="108" width="180" height="76" class="box" fill="#ffffff" stroke="#8fa3b6"/>
  <text x="150" y="134" class="t" text-anchor="middle">INTERNET</text>
  <text x="150" y="152" class="s" text-anchor="middle">Public networks</text>
  <text x="150" y="168" class="s" text-anchor="middle">Customers &amp; remote staff</text>

  <rect x="320" y="108" width="190" height="76" class="box" fill="#ffffff" stroke="#27ae60"/>
  <text x="415" y="130" class="t" text-anchor="middle">CDN + WAF + DDoS</text>
  <text x="415" y="148" class="s" text-anchor="middle">Filters L7 attacks</text>
  <text x="415" y="164" class="s" text-anchor="middle">Absorbs volumetric floods</text>

  <rect x="580" y="100" width="200" height="92" class="box" fill="#ffffff" stroke="#d68910"/>
  <text x="680" y="124" class="t" text-anchor="middle">WEB SERVICE  A-06</text>
  <text x="680" y="142" class="s" text-anchor="middle">Cloud VPS · Nginx · PHP</text>
  <text x="680" y="158" class="s" text-anchor="middle">HTTPS only · TLS 1.3 · HSTS</text>
  <text x="680" y="176" class="s" text-anchor="middle">198.51.100.25</text>

  <rect x="840" y="100" width="180" height="92" class="box" fill="#ffffff" stroke="#c0392b"/>
  <text x="930" y="124" class="t" text-anchor="middle">DATABASE  A-07</text>
  <text x="930" y="142" class="s" text-anchor="middle">MySQL · 8,000 records</text>
  <text x="930" y="158" class="s" text-anchor="middle">Private subnet, no public IP</text>
  <text x="930" y="176" class="s" text-anchor="middle">Encrypted at rest</text>

  <line x1="240" y1="146" x2="318" y2="146" class="ln" marker-end="url(#arw)"/>
  <line x1="510" y1="146" x2="578" y2="146" class="ln" marker-end="url(#arw)"/>
  <line x1="780" y1="146" x2="838" y2="146" class="ln" marker-end="url(#arw)"/>
  <text x="530" y="140" class="lbl">443</text>

  <!-- ISP + firewall -->
  <rect x="60" y="272" width="180" height="66" class="box" fill="#ffffff" stroke="#8fa3b6"/>
  <text x="150" y="296" class="t" text-anchor="middle">ISP CIRCUIT  A-08</text>
  <text x="150" y="313" class="s" text-anchor="middle">200 Mbps fibre</text>
  <text x="150" y="329" class="s" text-anchor="middle">+ 4G/5G failover · 203.0.113.10</text>

  <rect x="320" y="262" width="300" height="86" class="box" fill="#ffffff" stroke="#c0392b"/>
  <text x="470" y="286" class="t" text-anchor="middle">NEXT-GEN FIREWALL / ROUTER  A-03</text>
  <text x="470" y="304" class="s" text-anchor="middle">NAT · Stateful inspection · IPS · Content filter</text>
  <text x="470" y="320" class="s" text-anchor="middle">Client VPN with MFA · default-deny inbound</text>
  <text x="470" y="336" class="s" text-anchor="middle">Admin interface LAN-only (never WAN)</text>

  <rect x="700" y="262" width="320" height="86" class="box" fill="#ffffff" stroke="#2e5fa3"/>
  <text x="860" y="286" class="t" text-anchor="middle">MANAGED SWITCH  A-04</text>
  <text x="860" y="304" class="s" text-anchor="middle">802.1Q VLAN tagging · DHCP snooping</text>
  <text x="860" y="320" class="s" text-anchor="middle">Dynamic ARP inspection · port security</text>
  <text x="860" y="336" class="s" text-anchor="middle">Unused ports administratively disabled</text>

  <line x1="150" y1="184" x2="150" y2="270" class="ln" marker-end="url(#arw)"/>
  <line x1="240" y1="305" x2="318" y2="305" class="ln" marker-end="url(#arw)"/>
  <line x1="620" y1="305" x2="698" y2="305" class="ln" marker-end="url(#arw)"/>

  <!-- VLANs -->
  <rect x="45" y="412" width="220" height="112" class="box" fill="#ffffff" stroke="#27ae60"/>
  <text x="155" y="436" class="t" text-anchor="middle">VLAN 10 — CORPORATE</text>
  <text x="155" y="454" class="s" text-anchor="middle">192.168.10.0/24 · DHCP</text>
  <text x="155" y="472" class="s" text-anchor="middle">Employee laptops  A-01</text>
  <text x="155" y="490" class="s" text-anchor="middle">15 devices · BitLocker/FileVault</text>
  <text x="155" y="508" class="s" text-anchor="middle">EDR · no local admin</text>

  <rect x="290" y="412" width="220" height="112" class="box" fill="#ffffff" stroke="#d68910"/>
  <text x="400" y="436" class="t" text-anchor="middle">VLAN 20 — SERVERS</text>
  <text x="400" y="454" class="s" text-anchor="middle">192.168.20.0/24 · static</text>
  <text x="400" y="472" class="s" text-anchor="middle">File server  A-02</text>
  <text x="400" y="490" class="s" text-anchor="middle">Windows Server · SMB 3 signed</text>
  <text x="400" y="508" class="s" text-anchor="middle">Least-privilege NTFS ACLs</text>

  <rect x="535" y="412" width="220" height="112" class="box" fill="#ffffff" stroke="#c0392b"/>
  <text x="645" y="436" class="t" text-anchor="middle">VLAN 30 — GUEST WI-FI</text>
  <text x="645" y="454" class="s" text-anchor="middle">192.168.30.0/24 · 4h lease</text>
  <text x="645" y="472" class="s" text-anchor="middle">Guest / BYOD devices</text>
  <text x="645" y="490" class="s" text-anchor="middle">Client isolation enabled</text>
  <text x="645" y="508" class="s" text-anchor="middle">INTERNET ONLY — deny internal</text>

  <rect x="780" y="412" width="220" height="112" class="box" fill="#ffffff" stroke="#2e5fa3"/>
  <text x="890" y="436" class="t" text-anchor="middle">VLAN 99 — MANAGEMENT</text>
  <text x="890" y="454" class="s" text-anchor="middle">192.168.99.0/24 · static</text>
  <text x="890" y="472" class="s" text-anchor="middle">Switch, AP and FW admin</text>
  <text x="890" y="490" class="s" text-anchor="middle">Jump host + MFA required</text>
  <text x="890" y="508" class="s" text-anchor="middle">No route from any other VLAN</text>

  <rect x="290" y="556" width="220" height="96" class="box" fill="#ffffff" stroke="#7d3c98"/>
  <text x="400" y="580" class="t" text-anchor="middle">VLAN 40 — BACKUP</text>
  <text x="400" y="598" class="s" text-anchor="middle">192.168.40.0/24 · static</text>
  <text x="400" y="616" class="s" text-anchor="middle">NAS  A-10 · pull-based</text>
  <text x="400" y="634" class="s" text-anchor="middle">Immutable snapshots, no SMB write</text>

  <rect x="535" y="556" width="220" height="96" class="box" fill="#ffffff" stroke="#27ae60"/>
  <text x="645" y="580" class="t" text-anchor="middle">WI-FI ACCESS POINTS  A-05</text>
  <text x="645" y="598" class="s" text-anchor="middle">WPA3-Enterprise → VLAN 10</text>
  <text x="645" y="616" class="s" text-anchor="middle">WPA3-Personal  → VLAN 30</text>
  <text x="645" y="634" class="s" text-anchor="middle">WPS disabled · rogue AP detection</text>

  <rect x="330" y="720" width="380" height="66" class="box" fill="#ffffff" stroke="#2e5fa3"/>
  <text x="520" y="744" class="t" text-anchor="middle">OFFSITE / CLOUD BACKUP</text>
  <text x="520" y="762" class="s" text-anchor="middle">3-2-1 rule · encrypted in transit and at rest</text>
  <text x="520" y="778" class="s" text-anchor="middle">Immutable copy · quarterly test restore</text>

  <!-- switch to vlans -->
  <line x1="860" y1="348" x2="860" y2="380" class="ln"/>
  <line x1="155" y1="380" x2="890" y2="380" class="ln"/>
  <line x1="155" y1="380" x2="155" y2="410" class="ln" marker-end="url(#arw)"/>
  <line x1="400" y1="380" x2="400" y2="410" class="ln" marker-end="url(#arw)"/>
  <line x1="645" y1="380" x2="645" y2="410" class="ln" marker-end="url(#arw)"/>
  <line x1="890" y1="380" x2="890" y2="410" class="ln" marker-end="url(#arw)"/>

  <line x1="400" y1="524" x2="400" y2="554" class="dn"/>
  <text x="410" y="544" class="lbl" fill="#c0392b">pull only (read)</text>
  <line x1="645" y1="556" x2="645" y2="526" class="ln" marker-end="url(#arw)"/>
  <line x1="400" y1="652" x2="400" y2="718" class="ln" marker-end="url(#arw)"/>
  <text x="410" y="690" class="lbl">encrypted replication</text>

  <!-- legend -->
  <rect x="770" y="700" width="250" height="92" fill="#ffffff" stroke="#dbe4ed" rx="8"/>
  <text x="786" y="720" class="t">Legend</text>
  <line x1="786" y1="736" x2="820" y2="736" class="ln"/>
  <text x="828" y="740" class="s">Permitted traffic flow</text>
  <line x1="786" y1="756" x2="820" y2="756" class="dn"/>
  <text x="828" y="760" class="s">Restricted / one-way flow</text>
  <text x="786" y="780" class="s">Default policy between VLANs: DENY</text>
</svg>
